<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blue Harbor Rentals — Booking</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <h1>Blue Harbor Rentals</h1>
  <p class="tagline">Local boat &amp; gear booking demo (mock site, runs offline).</p>

  <form id="booking" onsubmit="return false">
    <label>Full name <input id="name" placeholder="Full name"></label>
    <label>Date <input id="date" type="date" value="2026-11-15"></label>
    <label>Guests
      <select id="guests">
        <option>1</option><option>2</option><option selected>3</option>
        <option>4</option><option>5</option><option>6</option>
      </select>
    </label>
    <button id="submit" type="button">Book now</button>
  </form>

  <div id="confirm" hidden></div>

  <nav>
    <a href="/index.html">Home</a>
    <a href="/about.html">About</a>
  </nav>

  <script>
    document.getElementById('submit').addEventListener('click', () => {
      const name = document.getElementById('name').value.trim();
      if (!name) return;
      const code = 'BK-' + Math.random().toString(36).slice(2, 8).toUpperCase();
      const box = document.getElementById('confirm');
      box.textContent = 'Confirmed ' + code + ' for ' + name;
      box.hidden = false;
    });
  </script>
</body>
</html>
